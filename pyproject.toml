[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "statementtrace"
version = "0.1.0"
description = "As-of financial statements with exact-period selection and replayable ratio lineage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "dev-belly"}]
dependencies = []

[project.scripts]
statementtrace = "statementtrace.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.11.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
statementtrace = ["data/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
