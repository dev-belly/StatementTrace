[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "statementtrace"
version = "0.1.0"
description = "As-of financial statements with exact-period selection and replayable ratio lineage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "dev-belly"}]
dependencies = []

[project.scripts]
statementtrace = "statementtrace.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.11.13", "httpx>=0.27,<1"]
warehouse = ["polars>=1.30,<2", "duckdb>=1.3,<2"]
dbt = ["dbt-core>=1.10.5,<2", "dbt-duckdb>=1.9,<2"]
api = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
statementtrace = ["data/*.json", "data/*.sql", "data/*.html"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
