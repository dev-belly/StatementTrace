name: Bug report
description: "Reproduce a problem with filing-date cutoffs, exact fiscal periods and metric lineage."
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or appropriately licensed public inputs. Do not attach private records or credentials.
        Suspected vulnerabilities: follow [SECURITY.md](https://github.com/dev-belly/StatementTrace/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version or full commit
      description: Include the installed package version and source revision when known.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or API call
      description: Include the working directory assumptions and exact options.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproducible input and steps
      description: "A few CompanyFacts-shaped records and one fiscal-period request, with issuer identifiers replaced."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: "State as_of, period start/end, concept, unit and the selected fact ID. Distinguish source-data changes from selection or formula changes."
    validations:
      required: true
