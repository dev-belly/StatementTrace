name: Financial warehouse

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warehouse:
    name: Warehouse / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.12'}
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      POLARS_MAX_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.13.6
      - name: Install the locked financial stack
        run: uv sync --locked --extra warehouse --extra dbt --extra dev
      - name: Exact columnar contracts
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Build and replay the historical financial packet
        run: |
          uv run --locked statementtrace warehouse --out output/warehouse
          uv run --locked statementtrace verify-warehouse output/warehouse
          uv run --locked python scripts/check_warehouse_dbt.py output/warehouse
      - name: Missing facts remain missing across dbt models
        run: |
          uv run --locked statementtrace warehouse --as-of 2025-02-04 --out output/early
          uv run --locked python scripts/check_warehouse_dbt.py output/early
      - name: Installed wheel outside checkout
        shell: bash
        run: |
          uv build --wheel --out-dir output/wheels
          uv venv output/installed
          if [ "$RUNNER_OS" = Windows ]; then
            installed_python="$GITHUB_WORKSPACE/output/installed/Scripts/python.exe"
          else
            installed_python="$GITHUB_WORKSPACE/output/installed/bin/python"
          fi
          uv pip install --python "$installed_python" "$(pwd)/output/wheels/statementtrace-0.1.0-py3-none-any.whl[warehouse]"
          cd "$RUNNER_TEMP"
          "$installed_python" -m statementtrace warehouse --out wheel-warehouse
          "$installed_python" -m statementtrace verify-warehouse wheel-warehouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: financial-warehouse-${{ matrix.os }}-${{ matrix.python }}
          path: output/warehouse
